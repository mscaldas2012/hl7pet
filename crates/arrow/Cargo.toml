[package]
name = "hl7pet-arrow"
version = "0.1.0"
edition = "2021"

[lib]
name = "_hl7pet_arrow"
crate-type = ["cdylib"]

[dependencies]
hl7pet-core = { path = "../core" }
arrow = "59"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
# default-features = false disables pyo3-arrow's `buffer_protocol` feature,
# which requires either abi3-py311 or a non-abi3 build (research.md #2 spike,
# resolved: builds clean under abi3-py39 with the default off). We don't need
# buffer_protocol -- PyArray's Arrow C Data Interface support is unaffected.
pyo3-arrow = { version = "0.19", default-features = false }
